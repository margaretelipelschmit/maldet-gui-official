<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maldet GUI - Linux Malware Detect Web Interface</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">🛡️</span>
                    <span class="logo-text">Maldet GUI</span>
                </div>
                <span class="version-badge" id="version-badge">v1.0.0</span>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard" data-i18n="dashboard"><span class="nav-icon">📊</span><span class="nav-text">Dashboard</span></a>
                <a href="#" class="nav-item" data-page="scanner" data-i18n="scanner"><span class="nav-icon">🔍</span><span class="nav-text">Scanner</span></a>
                <a href="#" class="nav-item" data-page="scan-management" data-i18n="scan-management"><span class="nav-icon">⚙️</span><span class="nav-text">Scan Management</span></a>
                <a href="#" class="nav-item" data-page="quarantine" data-i18n="quarantine"><span class="nav-icon">📦</span><span class="nav-text">Quarantine</span></a>
                <a href="#" class="nav-item" data-page="reports" data-i18n="reports"><span class="nav-icon">📄</span><span class="nav-text">Reports</span></a>
                <a href="#" class="nav-item" data-page="monitoring" data-i18n="monitoring"><span class="nav-icon">👁️</span><span class="nav-text">Monitoring</span></a>
                <a href="#" class="nav-item" data-page="updates" data-i18n="updates"><span class="nav-icon">⬆️</span><span class="nav-text">Updates</span></a>
                <a href="#" class="nav-item" data-page="security" data-i18n="security"><span class="nav-icon">🔐</span><span class="nav-text">Security</span></a>
                <a href="#" class="nav-item" data-page="config" data-i18n="config"><span class="nav-icon">⚙️</span><span class="nav-text">Configuration</span></a>
                <a href="#" class="nav-item" data-page="alerts" data-i18n="alerts"><span class="nav-icon">🔔</span><span class="nav-text">Test Alerts</span></a>
                <a href="#" class="nav-item" data-page="logs" data-i18n="logs"><span class="nav-icon">📝</span><span class="nav-text">Event Log</span></a>
                <a href="#" class="nav-item" data-page="ignore" data-i18n="ignore"><span class="nav-icon">🚫</span><span class="nav-text">Ignore Lists</span></a>
                <a href="#" class="nav-item" data-page="maintenance" data-i18n="maintenance"><span class="nav-icon">🔧</span><span class="nav-text">Maintenance</span></a>
                <a href="#" class="nav-item" data-page="system" data-i18n="system"><span class="nav-icon">🖥️</span><span class="nav-text">System Info</span></a>
                <a href="#" class="nav-item" data-page="about" data-i18n="about"><span class="nav-icon">ℹ️</span><span class="nav-text">About Maldet</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator" id="status-indicator">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Checking...</span>
                </div>
            </div>
        </div>
        <div id="main">
            <div class="top-bar">
                <div class="page-title" id="page-title">Dashboard</div>
                <div class="top-bar-actions">
                    <label class="language-picker" for="language-select">Language
                        <select id="language-select" class="form-input form-input-sm">
                            <option value="en">English</option>
                            <option value="pt-BR">Português (Brasil)</option>
                        </select>
                    </label>
                    <button class="btn btn-ghost btn-sm" id="refresh-btn" title="Refresh">🔄</button>
                    <button class="btn btn-ghost btn-sm" id="settings-btn" title="Settings">⚙️</button>
                </div>
            </div>
            <div class="content" id="content">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
    <script src="/static/app.js?v=48"></script>
    <script>
    // Boot check: se o app.js não carregar/executar (cache antigo, bloqueio,
    // erro de rede), mostra o motivo na própria página em vez de "Loading...".
    window.addEventListener('load', function() {
        setTimeout(function() {
            if (window.__maldet_booted) return;
            var c = document.getElementById('content');
            if (c && c.querySelector('.loading')) {
                c.innerHTML = '<div class="card"><p style="color:red;"><strong>Falha ao carregar o JavaScript da interface (/static/app.js).</strong></p>' +
                    '<p style="font-size:13px;">Pressione <strong>Ctrl+F5</strong> para forçar a recarga sem cache. ' +
                    'Se persistir, abra o Console do navegador (F12) e verifique erros, ou teste: ' +
                    '<code>curl http://127.0.0.1:32501/static/app.js | head -c 100</code></p></div>';
            }
        }, 8000);
    });
    </script>
    </body>
</html>
